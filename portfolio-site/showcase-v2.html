/* Clear, client-facing capability cards */
.capability-stack{display:grid;gap:11px;margin:22px 0 18px;position:relative;z-index:1}
.capability-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:12px 13px;background:#0e1711b8;border:1px solid #3a503b;border-radius:14px}
.capability-key{display:grid;place-items:center;min-height:38px;border:1px solid #607d4c;border-radius:10px;background:#1d2b1d;color:var(--bright);font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.04em}
.hero-visual .capability-row b{font-size:14px;line-height:1.6;margin:0;position:relative;z-index:1}
.hero-visual .capability-row p{font-size:11px;line-height:1.8;margin:2px 0 0;max-width:none;position:relative;z-index:1}
.capability-foot{display:flex;gap:7px;flex-wrap:wrap;position:relative;z-index:1}
.capability-foot span{border:1px solid #435a43;border-radius:100px;padding:4px 9px;color:#d4e6cc;font:10px/1.6 ui-monospace,monospace}
.service-offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.service-offer{min-width:0;display:flex;flex-direction:column;padding:23px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#17231b,#101713);transition:transform .18s,border-color .18s}
.service-offer:hover{transform:translateY(-3px);border-color:#789653}
.service-offer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.service-index{color:#9bb48f;font:11px ui-monospace,monospace}
.service-mark{display:grid;place-items:center;min-width:54px;min-height:38px;border:1px solid #425a42;border-radius:10px;background:#202f21;color:var(--bright);font:700 10px ui-monospace,monospace}
.service-offer h3{font-size:19px;margin:0 0 9px;line-height:1.7}
.service-offer p{font-size:13px;line-height:2;color:var(--muted);flex:1;margin:0 0 20px}
.service-offer .btn{width:100%;justify-content:center}
.contact-area{margin-top:50px}
.contact-area .contact-band{margin-top:0}
.brief-builder{display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;margin-top:14px;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(140deg,#151f18,#0f1712)}
.brief-intro h3{font-size:23px;line-height:1.7;margin:10px 0}
.brief-intro>p{font-size:13px;line-height:2.1;color:var(--muted)}
.brief-points{display:grid;gap:9px;margin-top:20px}
.brief-points span{font-size:11px;color:#c5d8bf;border-inline-start:2px solid #789653;padding-inline-start:10px}
.brief-form{display:grid;gap:8px;align-content:start;min-width:0}
.brief-form label,.feature-search-label{font-size:12px;color:#d8e7d2;font-weight:600;margin-top:5px}
.brief-form select,.brief-form textarea,.feature-search{width:100%;min-width:0;border:1px solid #435b45;border-radius:11px;padding:12px 13px;background:#0b130e;color:var(--text);font:inherit;line-height:1.8}
.brief-form select{min-height:47px}
.brief-form textarea{resize:vertical}
.brief-form textarea::placeholder,.feature-search::placeholder{color:#829585}
.brief-form .btn{justify-self:start;margin-top:6px}
.brief-form #brief-output{margin-top:10px;min-height:135px}
.brief-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brief-actions span{font-size:11px;line-height:1.9;color:#9eb29f}
.feature-search-label{display:block;margin-top:20px}
.feature-search{margin-top:7px;max-width:100%}
.feature-count{font-size:11px;color:var(--sub);margin:7px 0 0}
.feature-links a[hidden]{display:none!important}
